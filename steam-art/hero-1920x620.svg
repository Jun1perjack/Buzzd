<svg width="920" height="430" viewBox="0 0 920 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#09091a"/>
      <stop offset="40%"  stop-color="#0e0e22"/>
      <stop offset="100%" stop-color="#09091a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF7200"/>
      <stop offset="100%" stop-color="#E8003D"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF7200"/>
      <stop offset="100%" stop-color="#E8003D"/>
    </linearGradient>
    <radialGradient id="buzzFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#99001a"/>
    </radialGradient>
    <radialGradient id="gCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E8003D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E8003D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF7200" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF7200" stop-opacity="0"/>
    </radialGradient>

    <filter id="titleGlow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="pg1" x="-50%" y="-30%" width="200%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FFD500" flood-opacity="0.52"/>
    </filter>
    <filter id="pg2" x="-50%" y="-30%" width="200%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#3B9EFF" flood-opacity="0.46"/>
    </filter>
    <filter id="pg3" x="-50%" y="-30%" width="200%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#4CAF50" flood-opacity="0.44"/>
    </filter>
    <filter id="pg4" x="-50%" y="-30%" width="200%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#C850F8" flood-opacity="0.44"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="430" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.025" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="86"  x2="920" y2="86"/>
    <line x1="0" y1="172" x2="920" y2="172"/>
    <line x1="0" y1="258" x2="920" y2="258"/>
    <line x1="0" y1="344" x2="920" y2="344"/>
    <line x1="184" y1="0" x2="184" y2="430"/>
    <line x1="368" y1="0" x2="368" y2="430"/>
    <line x1="552" y1="0" x2="552" y2="430"/>
    <line x1="736" y1="0" x2="736" y2="430"/>
  </g>

  <!-- Glow blobs -->
  <ellipse cx="570" cy="215" rx="370" ry="200" fill="url(#gCenter)"/>
  <ellipse cx="190" cy="215" rx="200" ry="150" fill="url(#gLeft)"/>

  <!-- Official Steam Deck silhouette — faint background watermark -->
  <g transform="translate(19, 136) scale(0.38)" opacity="0.055">
    <path d="M4.68799 138.986C4.07808 84.8566 3.77312 57.7917 17.3951 38.7736C21.7923 32.6345 27.135 27.2312 33.2243 22.765C52.0876 8.92969 79.1543 8.92969 133.288 8.92969H891.302C945.435 8.92969 972.502 8.92969 991.365 22.765C997.454 27.2312 1002.8 32.6345 1007.19 38.7736C1020.82 57.7917 1020.51 84.8566 1019.9 138.986L1018.87 230.404C1018.05 303.325 1017.64 339.786 998.847 365.286C992.776 373.525 985.454 380.765 977.146 386.744C951.436 405.247 914.973 405.247 842.047 405.247H182.542C109.616 405.247 73.1532 405.247 47.443 386.744C39.1358 380.765 31.8139 373.525 25.7421 365.286C6.95052 339.786 6.53969 303.325 5.71804 230.404L4.68799 138.986Z" fill="white"/>
  </g>

  <!-- ── Left column ──────────────────────────────────────────────── -->

  <!-- Accent bar -->
  <rect x="37" y="52" width="4" height="308" rx="2" fill="url(#accentBar)" opacity="0.7"/>

  <!-- BUZZD -->
  <text x="54" y="170"
    font-family="Arial Black, Impact, sans-serif"
    font-size="88" font-weight="900"
    fill="url(#titleGrad)"
    letter-spacing="5"
    filter="url(#titleGlow)">BUZZD</text>

  <!-- Tagline -->
  <text x="59" y="203"
    font-family="Arial, sans-serif"
    font-size="13" fill="#5a5a7a"
    letter-spacing="4">YOUR PHONE. YOUR BUZZ.</text>

  <!-- Feature pills — row 1 -->
  <rect x="59"  y="222" width="90"  height="24" rx="12" fill="#12122a" stroke="#252548" stroke-width="1.5"/>
  <text x="104" y="238" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="10" fill="#7878a0" letter-spacing="2">4 PLAYERS</text>

  <rect x="157" y="222" width="126" height="24" rx="12" fill="#12122a" stroke="#252548" stroke-width="1.5"/>
  <text x="220" y="238" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="10" fill="#7878a0" letter-spacing="2">NO APP NEEDED</text>

  <!-- Feature pills — row 2 -->
  <rect x="59"  y="254" width="150" height="24" rx="12" fill="#12122a" stroke="#252548" stroke-width="1.5"/>
  <text x="134" y="270" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="10" fill="#7878a0" letter-spacing="2">STEAM DECK + PCSX2</text>

  <!-- Player colour dots -->
  <circle cx="59"  cy="302" r="8" fill="#FFD500"/>
  <circle cx="81"  cy="302" r="8" fill="#3B9EFF"/>
  <circle cx="103" cy="302" r="8" fill="#4CAF50"/>
  <circle cx="125" cy="302" r="8" fill="#C850F8"/>

  <!-- Divider -->
  <line x1="428" y1="30" x2="428" y2="396" stroke="#181830" stroke-width="1.5"/>

  <!-- ── Right column: 4 phones ──────────────────────────────────── -->

  <!-- Phone 1: P1 Gold — iPhone -->
  <g transform="translate(436, 10)" filter="url(#pg1)">
    <rect x="0" y="0" width="108" height="246" rx="18" fill="#181828" stroke="#FFD500" stroke-width="2"/>
    <rect x="3" y="3" width="102" height="240" rx="15" fill="#07070f"/>
    <!-- Dynamic Island -->
    <rect x="31" y="10" width="46" height="11" rx="5.5" fill="#040406"/>
    <!-- Crown icon -->
    <g transform="translate(48, 30) scale(0.55)" fill="none" stroke="#FFD500" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m2 4 3 12h14l3-12-6 5-4-5-4 5-6-5z"/>
      <path d="M5 20h14"/>
    </g>
    <!-- Player label -->
    <text x="54" y="51" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#FFD500" letter-spacing="2">P1 · JACK</text>
    <!-- BUZZ button -->
    <circle cx="54" cy="123" r="41" fill="url(#buzzFill)"/>
    <circle cx="54" cy="123" r="41" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2.5"/>
    <text x="54" y="131" text-anchor="middle"
      font-family="Arial Black, sans-serif" font-size="15" fill="white" font-weight="900">BUZZ!</text>
    <!-- Answer grid -->
    <rect x="9"  y="173" width="41" height="19" rx="5" fill="#3B9EFF"/>
    <rect x="58" y="173" width="41" height="19" rx="5" fill="#FF7200"/>
    <rect x="9"  y="197" width="41" height="19" rx="5" fill="#4CAF50"/>
    <rect x="58" y="197" width="41" height="19" rx="5" fill="#FFD500"/>
    <!-- Side buttons -->
    <rect x="-3" y="54" width="3" height="14" rx="1.5" fill="#252525"/>
    <rect x="-3" y="74" width="3" height="20" rx="1.5" fill="#252525"/>
    <rect x="-3" y="99" width="3" height="20" rx="1.5" fill="#252525"/>
    <rect x="108" y="70" width="3" height="30" rx="1.5" fill="#252525"/>
  </g>

  <!-- Phone 2: P2 Blue — Android -->
  <g transform="translate(552, 48)" filter="url(#pg2)">
    <rect x="0" y="0" width="102" height="232" rx="15" fill="#10101e" stroke="#3B9EFF" stroke-width="2"/>
    <rect x="2" y="2" width="98"  height="228" rx="12" fill="#07070f"/>
    <!-- Punch-hole camera -->
    <circle cx="51" cy="15" r="6" fill="#040406"/>
    <circle cx="51" cy="15" r="6" fill="none" stroke="rgba(59,158,255,0.25)" stroke-width="1.5"/>
    <!-- Player label -->
    <text x="51" y="38" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#3B9EFF" letter-spacing="2">P2 · SARAH</text>
    <!-- BUZZ button -->
    <circle cx="51" cy="113" r="40" fill="url(#buzzFill)"/>
    <circle cx="51" cy="113" r="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2.5"/>
    <text x="51" y="121" text-anchor="middle"
      font-family="Arial Black, sans-serif" font-size="15" fill="white" font-weight="900">BUZZ!</text>
    <!-- Answer grid -->
    <rect x="8"  y="162" width="39" height="17" rx="4" fill="#3B9EFF"/>
    <rect x="55" y="162" width="39" height="17" rx="4" fill="#FF7200"/>
    <rect x="8"  y="184" width="39" height="17" rx="4" fill="#4CAF50"/>
    <rect x="55" y="184" width="39" height="17" rx="4" fill="#FFD500"/>
    <!-- Side buttons -->
    <rect x="-3" y="52" width="3" height="16" rx="1.5" fill="#1e1e2e"/>
    <rect x="-3" y="73" width="3" height="16" rx="1.5" fill="#1e1e2e"/>
    <rect x="102" y="63" width="3" height="27" rx="1.5" fill="#1e1e2e"/>
  </g>

  <!-- Phone 3: P3 Green — iPhone -->
  <g transform="translate(662, 18)" filter="url(#pg3)">
    <rect x="0" y="0" width="108" height="246" rx="18" fill="#0e1810" stroke="#4CAF50" stroke-width="2"/>
    <rect x="3" y="3" width="102" height="240" rx="15" fill="#07070f"/>
    <!-- Dynamic Island -->
    <rect x="31" y="10" width="46" height="11" rx="5.5" fill="#040406"/>
    <!-- Player label -->
    <text x="54" y="38" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#4CAF50" letter-spacing="2">P3 · MIKE</text>
    <!-- BUZZ button -->
    <circle cx="54" cy="123" r="41" fill="url(#buzzFill)"/>
    <circle cx="54" cy="123" r="41" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2.5"/>
    <text x="54" y="131" text-anchor="middle"
      font-family="Arial Black, sans-serif" font-size="15" fill="white" font-weight="900">BUZZ!</text>
    <!-- Answer grid -->
    <rect x="9"  y="173" width="41" height="19" rx="5" fill="#3B9EFF"/>
    <rect x="58" y="173" width="41" height="19" rx="5" fill="#FF7200"/>
    <rect x="9"  y="197" width="41" height="19" rx="5" fill="#4CAF50"/>
    <rect x="58" y="197" width="41" height="19" rx="5" fill="#FFD500"/>
    <!-- Side buttons -->
    <rect x="-3" y="54" width="3" height="14" rx="1.5" fill="#252525"/>
    <rect x="-3" y="74" width="3" height="20" rx="1.5" fill="#252525"/>
    <rect x="-3" y="99" width="3" height="20" rx="1.5" fill="#252525"/>
    <rect x="108" y="70" width="3" height="30" rx="1.5" fill="#252525"/>
  </g>

  <!-- Phone 4: P4 Purple — Android -->
  <g transform="translate(778, 44)" filter="url(#pg4)">
    <rect x="0" y="0" width="102" height="232" rx="15" fill="#12081a" stroke="#C850F8" stroke-width="2"/>
    <rect x="2" y="2" width="98"  height="228" rx="12" fill="#07070f"/>
    <!-- Punch-hole camera -->
    <circle cx="51" cy="15" r="6" fill="#040406"/>
    <circle cx="51" cy="15" r="6" fill="none" stroke="rgba(200,80,248,0.3)" stroke-width="1.5"/>
    <!-- Player label -->
    <text x="51" y="38" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#C850F8" letter-spacing="2">P4 · EMMA</text>
    <!-- BUZZ button -->
    <circle cx="51" cy="113" r="40" fill="url(#buzzFill)"/>
    <circle cx="51" cy="113" r="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2.5"/>
    <text x="51" y="121" text-anchor="middle"
      font-family="Arial Black, sans-serif" font-size="15" fill="white" font-weight="900">BUZZ!</text>
    <!-- Answer grid -->
    <rect x="8"  y="162" width="39" height="17" rx="4" fill="#3B9EFF"/>
    <rect x="55" y="162" width="39" height="17" rx="4" fill="#FF7200"/>
    <rect x="8"  y="184" width="39" height="17" rx="4" fill="#4CAF50"/>
    <rect x="55" y="184" width="39" height="17" rx="4" fill="#FFD500"/>
    <!-- Side buttons -->
    <rect x="-3" y="52" width="3" height="16" rx="1.5" fill="#1e1e2e"/>
    <rect x="-3" y="73" width="3" height="16" rx="1.5" fill="#1e1e2e"/>
    <rect x="102" y="63" width="3" height="27" rx="1.5" fill="#1e1e2e"/>
  </g>

  <!-- Player dots below phones -->
  <circle cx="490" cy="308" r="6" fill="#FFD500" opacity="0.7"/>
  <circle cx="603" cy="308" r="6" fill="#3B9EFF"  opacity="0.7"/>
  <circle cx="716" cy="308" r="6" fill="#4CAF50"  opacity="0.7"/>
  <circle cx="829" cy="308" r="6" fill="#C850F8"  opacity="0.7"/>

  <!-- Bottom gradient bar -->
  <rect x="0" y="422" width="920" height="8" fill="url(#accentBar)" opacity="0.5"/>
</svg>
