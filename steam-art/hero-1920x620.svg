<svg width="1920" height="620" viewBox="0 0 1920 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#09091a"/>
      <stop offset="40%"  stop-color="#0e0e22"/>
      <stop offset="100%" stop-color="#09091a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF7200"/>
      <stop offset="100%" stop-color="#E8003D"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF7200"/>
      <stop offset="100%" stop-color="#E8003D"/>
    </linearGradient>
    <radialGradient id="buzzFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#99001a"/>
    </radialGradient>
    <radialGradient id="gCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E8003D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E8003D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF7200" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF7200" stop-opacity="0"/>
    </radialGradient>

    <!-- Title glow -->
    <filter id="titleGlow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Per-player coloured drop-shadow glows -->
    <filter id="pg1" x="-50%" y="-30%" width="200%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#FFD500" flood-opacity="0.50"/>
    </filter>
    <filter id="pg2" x="-50%" y="-30%" width="200%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#3B9EFF" flood-opacity="0.45"/>
    </filter>
    <filter id="pg3" x="-50%" y="-30%" width="200%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#4CAF50" flood-opacity="0.42"/>
    </filter>
    <filter id="pg4" x="-50%" y="-30%" width="200%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#C850F8" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────────── -->
  <rect width="1920" height="620" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.025" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="124" x2="1920" y2="124"/>
    <line x1="0" y1="248" x2="1920" y2="248"/>
    <line x1="0" y1="372" x2="1920" y2="372"/>
    <line x1="0" y1="496" x2="1920" y2="496"/>
    <line x1="240" y1="0" x2="240" y2="620"/>
    <line x1="480" y1="0" x2="480" y2="620"/>
    <line x1="720" y1="0" x2="720" y2="620"/>
    <line x1="960" y1="0" x2="960" y2="620"/>
    <line x1="1200" y1="0" x2="1200" y2="620"/>
    <line x1="1440" y1="0" x2="1440" y2="620"/>
    <line x1="1680" y1="0" x2="1680" y2="620"/>
  </g>

  <!-- Glow blobs -->
  <ellipse cx="1140" cy="300" rx="700" ry="320" fill="url(#gCenter)"/>
  <ellipse cx="380"  cy="300" rx="340" ry="220" fill="url(#gLeft)"/>

  <!-- Official Steam Deck silhouette — faint background watermark -->
  <g transform="translate(432, 172) scale(0.664)" opacity="0.055">
    <path d="M4.68799 138.986C4.07808 84.8566 3.77312 57.7917 17.3951 38.7736C21.7923 32.6345 27.135 27.2312 33.2243 22.765C52.0876 8.92969 79.1543 8.92969 133.288 8.92969H891.302C945.435 8.92969 972.502 8.92969 991.365 22.765C997.454 27.2312 1002.8 32.6345 1007.19 38.7736C1020.82 57.7917 1020.51 84.8566 1019.9 138.986L1018.87 230.404C1018.05 303.325 1017.64 339.786 998.847 365.286C992.776 373.525 985.454 380.765 977.146 386.744C951.436 405.247 914.973 405.247 842.047 405.247H182.542C109.616 405.247 73.1532 405.247 47.443 386.744C39.1358 380.765 31.8139 373.525 25.7421 365.286C6.95052 339.786 6.53969 303.325 5.71804 230.404L4.68799 138.986Z" fill="white"/>
  </g>

  <!-- ── Left column ─────────────────────────────────────────────────── -->

  <!-- Accent bar -->
  <rect x="74" y="100" width="4" height="420" rx="2" fill="url(#accentBar)" opacity="0.7"/>

  <!-- BUZZD -->
  <text x="100" y="265"
    font-family="Arial Black, Impact, sans-serif"
    font-size="178" font-weight="900"
    fill="url(#titleGrad)"
    letter-spacing="6"
    filter="url(#titleGlow)">BUZZD</text>

  <!-- Tagline -->
  <text x="106" y="322"
    font-family="Arial, sans-serif"
    font-size="25" fill="#5a5a7a"
    letter-spacing="6">YOUR PHONE. YOUR BUZZ.</text>

  <!-- Feature pills -->
  <rect x="106" y="360" width="152" height="34" rx="17" fill="#12122a" stroke="#252548" stroke-width="1.5"/>
  <text x="182" y="382" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="13" fill="#7878a0" letter-spacing="2">4 PLAYERS</text>

  <rect x="270" y="360" width="188" height="34" rx="17" fill="#12122a" stroke="#252548" stroke-width="1.5"/>
  <text x="364" y="382" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="13" fill="#7878a0" letter-spacing="2">NO APP NEEDED</text>

  <rect x="470" y="360" width="214" height="34" rx="17" fill="#12122a" stroke="#252548" stroke-width="1.5"/>
  <text x="577" y="382" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="13" fill="#7878a0" letter-spacing="2">STEAM DECK + PCSX2</text>

  <!-- Player colour dots -->
  <circle cx="112" cy="468" r="11" fill="#FFD500"/>
  <circle cx="142" cy="468" r="11" fill="#3B9EFF"/>
  <circle cx="172" cy="468" r="11" fill="#4CAF50"/>
  <circle cx="202" cy="468" r="11" fill="#C850F8"/>

  <!-- Divider -->
  <line x1="820" y1="40" x2="820" y2="580" stroke="#181830" stroke-width="1.5"/>

  <!-- ── Right column: 4 phones ──────────────────────────────────────── -->

  <!-- ── Phone 1: Player 1 (Gold) — iPhone style ── -->
  <g transform="translate(858, 52)" filter="url(#pg1)">
    <!-- Frame -->
    <rect x="0" y="0" width="148" height="338" rx="24" fill="#181828" stroke="#FFD500" stroke-width="2.5"/>
    <!-- Screen -->
    <rect x="4" y="4" width="140" height="330" rx="20" fill="#07070f"/>
    <!-- Dynamic Island -->
    <rect x="44" y="14" width="60" height="15" rx="7.5" fill="#040406"/>
    <!-- Crown icon (Lucide crown path, centred at x=52,y=46) -->
    <g transform="translate(43, 44) scale(0.75)" fill="none" stroke="#FFD500" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m2 4 3 12h14l3-12-6 5-4-5-4 5-6-5z"/>
      <path d="M5 20h14"/>
    </g>
    <!-- Player label -->
    <text x="84" y="62" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#FFD500" letter-spacing="2">P1 · JACK</text>
    <!-- BUZZ button -->
    <circle cx="74" cy="166" r="56" fill="url(#buzzFill)"/>
    <circle cx="74" cy="166" r="56" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
    <text x="74" y="175" text-anchor="middle"
      font-family="Arial Black, sans-serif" font-size="21" fill="white" font-weight="900">BUZZ!</text>
    <!-- Answer grid -->
    <rect x="13" y="238" width="56" height="26" rx="6" fill="#3B9EFF"/>
    <rect x="79" y="238" width="56" height="26" rx="6" fill="#FF7200"/>
    <rect x="13" y="270" width="56" height="26" rx="6" fill="#4CAF50"/>
    <rect x="79" y="270" width="56" height="26" rx="6" fill="#FFD500"/>
    <!-- Left side buttons (mute + vol up + vol down) -->
    <rect x="-4" y="74" width="4" height="20" rx="2" fill="#252525"/>
    <rect x="-4" y="102" width="4" height="28" rx="2" fill="#252525"/>
    <rect x="-4" y="136" width="4" height="28" rx="2" fill="#252525"/>
    <!-- Right power button -->
    <rect x="148" y="96" width="4" height="42" rx="2" fill="#252525"/>
  </g>

  <!-- ── Phone 2: Player 2 (Blue) — Android style ── -->
  <g transform="translate(1060, 104)" filter="url(#pg2)">
    <rect x="0" y="0" width="140" height="318" rx="20" fill="#10101e" stroke="#3B9EFF" stroke-width="2.5"/>
    <rect x="3" y="3" width="134" height="312" rx="17" fill="#07070f"/>
    <!-- Punch-hole camera -->
    <circle cx="70" cy="20" r="8" fill="#040406"/>
    <circle cx="70" cy="20" r="8" fill="none" stroke="rgba(59,158,255,0.25)" stroke-width="1.5"/>
    <!-- Player label -->
    <text x="70" y="52" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#3B9EFF" letter-spacing="2">P2 · SARAH</text>
    <!-- BUZZ button -->
    <circle cx="70" cy="154" r="54" fill="url(#buzzFill)"/>
    <circle cx="70" cy="154" r="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
    <text x="70" y="163" text-anchor="middle"
      font-family="Arial Black, sans-serif" font-size="20" fill="white" font-weight="900">BUZZ!</text>
    <!-- Answer grid -->
    <rect x="12" y="224" width="52" height="24" rx="5" fill="#3B9EFF"/>
    <rect x="76" y="224" width="52" height="24" rx="5" fill="#FF7200"/>
    <rect x="12" y="254" width="52" height="24" rx="5" fill="#4CAF50"/>
    <rect x="76" y="254" width="52" height="24" rx="5" fill="#FFD500"/>
    <!-- Left volume buttons -->
    <rect x="-4" y="72" width="4" height="22" rx="2" fill="#1e1e2e"/>
    <rect x="-4" y="102" width="4" height="22" rx="2" fill="#1e1e2e"/>
    <!-- Right power button -->
    <rect x="140" y="88" width="4" height="38" rx="2" fill="#1e1e2e"/>
  </g>

  <!-- ── Phone 3: Player 3 (Green) — iPhone style ── -->
  <g transform="translate(1257, 68)" filter="url(#pg3)">
    <rect x="0" y="0" width="148" height="338" rx="24" fill="#0e1810" stroke="#4CAF50" stroke-width="2.5"/>
    <rect x="4" y="4" width="140" height="330" rx="20" fill="#07070f"/>
    <!-- Dynamic Island -->
    <rect x="44" y="14" width="60" height="15" rx="7.5" fill="#040406"/>
    <!-- Player label -->
    <text x="74" y="50" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#4CAF50" letter-spacing="2">P3 · MIKE</text>
    <!-- BUZZ button -->
    <circle cx="74" cy="166" r="56" fill="url(#buzzFill)"/>
    <circle cx="74" cy="166" r="56" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
    <text x="74" y="175" text-anchor="middle"
      font-family="Arial Black, sans-serif" font-size="21" fill="white" font-weight="900">BUZZ!</text>
    <!-- Answer grid -->
    <rect x="13" y="238" width="56" height="26" rx="6" fill="#3B9EFF"/>
    <rect x="79" y="238" width="56" height="26" rx="6" fill="#FF7200"/>
    <rect x="13" y="270" width="56" height="26" rx="6" fill="#4CAF50"/>
    <rect x="79" y="270" width="56" height="26" rx="6" fill="#FFD500"/>
    <!-- Buttons -->
    <rect x="-4" y="74" width="4" height="20" rx="2" fill="#252525"/>
    <rect x="-4" y="102" width="4" height="28" rx="2" fill="#252525"/>
    <rect x="-4" y="136" width="4" height="28" rx="2" fill="#252525"/>
    <rect x="148" y="96" width="4" height="42" rx="2" fill="#252525"/>
  </g>

  <!-- ── Phone 4: Player 4 (Purple) — Android style ── -->
  <g transform="translate(1462, 100)" filter="url(#pg4)">
    <rect x="0" y="0" width="140" height="318" rx="20" fill="#12081a" stroke="#C850F8" stroke-width="2.5"/>
    <rect x="3" y="3" width="134" height="312" rx="17" fill="#07070f"/>
    <!-- Punch-hole camera -->
    <circle cx="70" cy="20" r="8" fill="#040406"/>
    <circle cx="70" cy="20" r="8" fill="none" stroke="rgba(200,80,248,0.3)" stroke-width="1.5"/>
    <!-- Player label -->
    <text x="70" y="52" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#C850F8" letter-spacing="2">P4 · EMMA</text>
    <!-- BUZZ button -->
    <circle cx="70" cy="154" r="54" fill="url(#buzzFill)"/>
    <circle cx="70" cy="154" r="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
    <text x="70" y="163" text-anchor="middle"
      font-family="Arial Black, sans-serif" font-size="20" fill="white" font-weight="900">BUZZ!</text>
    <!-- Answer grid -->
    <rect x="12" y="224" width="52" height="24" rx="5" fill="#3B9EFF"/>
    <rect x="76" y="224" width="52" height="24" rx="5" fill="#FF7200"/>
    <rect x="12" y="254" width="52" height="24" rx="5" fill="#4CAF50"/>
    <rect x="76" y="254" width="52" height="24" rx="5" fill="#FFD500"/>
    <!-- Buttons -->
    <rect x="-4" y="72" width="4" height="22" rx="2" fill="#1e1e2e"/>
    <rect x="-4" y="102" width="4" height="22" rx="2" fill="#1e1e2e"/>
    <rect x="140" y="88" width="4" height="38" rx="2" fill="#1e1e2e"/>
  </g>

  <!-- Player dots below phones (right column) -->
  <circle cx="932"  cy="536" r="7" fill="#FFD500" opacity="0.7"/>
  <circle cx="1130" cy="536" r="7" fill="#3B9EFF"  opacity="0.7"/>
  <circle cx="1331" cy="536" r="7" fill="#4CAF50"  opacity="0.7"/>
  <circle cx="1532" cy="536" r="7" fill="#C850F8"  opacity="0.7"/>

  <!-- Bottom gradient bar -->
  <rect x="0" y="610" width="1920" height="10" fill="url(#accentBar)" opacity="0.5"/>
</svg>
