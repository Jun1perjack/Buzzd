<svg width="600" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1E1E45"/>
      <stop offset="100%" stop-color="#0D0D1A"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7200"/>
      <stop offset="100%" stop-color="#E8003D"/>
    </linearGradient>
    <linearGradient id="buzzGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2255"/>
      <stop offset="100%" stop-color="#BB0030"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="0" y1="750" x2="600" y2="750"/>
    <line x1="150" y1="0" x2="150" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="450" y1="0" x2="450" y2="900"/>
  </g>

  <!-- Glow blob behind title -->
  <ellipse cx="300" cy="130" rx="220" ry="60" fill="#E8003D" opacity="0.15"/>

  <!-- BUZZD title -->
  <text x="300" y="165"
    font-family="Arial Black, Impact, sans-serif"
    font-size="108" font-weight="900"
    fill="url(#titleGrad)"
    text-anchor="middle"
    letter-spacing="6"
    filter="url(#glow)">BUZZD</text>

  <!-- Phone body -->
  <rect x="175" y="210" width="250" height="460" rx="32" fill="#1A1A35" stroke="#333" stroke-width="2"/>
  <!-- Phone screen -->
  <rect x="188" y="232" width="224" height="416" rx="20" fill="#0D0D1A"/>
  <!-- Front camera dot -->
  <circle cx="300" cy="224" r="5" fill="#222"/>

  <!-- BUZZ button -->
  <circle cx="300" cy="400" r="80" fill="url(#buzzGrad)" filter="url(#softglow)"/>
  <circle cx="300" cy="400" r="72" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="300" y="412"
    font-family="Arial Black, Impact, sans-serif"
    font-size="32" font-weight="900"
    fill="white" text-anchor="middle" letter-spacing="2">BUZZ!</text>

  <!-- Answer buttons 2×2 -->
  <rect x="202" y="498" width="88" height="54" rx="10" fill="#3B9EFF"/>
  <rect x="310" y="498" width="88" height="54" rx="10" fill="#FF7200"/>
  <rect x="202" y="562" width="88" height="54" rx="10" fill="#4CAF50"/>
  <rect x="310" y="562" width="88" height="54" rx="10" fill="#FFD500"/>

  <!-- Button labels -->
  <text x="246" y="530" font-family="Arial Black, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="900">BLUE</text>
  <text x="354" y="530" font-family="Arial Black, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="900">ORANGE</text>
  <text x="246" y="594" font-family="Arial Black, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="900">GREEN</text>
  <text x="354" y="594" font-family="Arial Black, sans-serif" font-size="13" fill="#111" text-anchor="middle" font-weight="900">YELLOW</text>

  <!-- Player colour row -->
  <circle cx="222" cy="726" r="16" fill="#FFD500"/>
  <text x="222" y="732" font-family="Arial Black, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="900">1</text>
  <circle cx="270" cy="726" r="16" fill="#3B9EFF"/>
  <text x="270" y="732" font-family="Arial Black, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="900">2</text>
  <circle cx="318" cy="726" r="16" fill="#4CAF50"/>
  <text x="318" y="732" font-family="Arial Black, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="900">3</text>
  <circle cx="366" cy="726" r="16" fill="#C850F8"/>
  <text x="366" y="732" font-family="Arial Black, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="900">4</text>

  <!-- Tagline -->
  <text x="300" y="798"
    font-family="Arial, sans-serif" font-size="18"
    fill="#777" text-anchor="middle" letter-spacing="4">YOUR PHONE. YOUR BUZZ.</text>

  <!-- Sub-tagline -->
  <text x="300" y="840"
    font-family="Arial, sans-serif" font-size="13"
    fill="#444" text-anchor="middle" letter-spacing="3">STEAM DECK · PCSX2 · 4 PLAYERS</text>

  <!-- Bottom bar accent -->
  <rect x="0" y="875" width="600" height="4" fill="url(#titleGrad)" opacity="0.7"/>
</svg>
