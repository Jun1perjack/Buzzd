; Buzzd Virtual Controller — PCSX2 USB Configuration
;
; This snippet shows what your PCSX2.ini should look like once you have
; bound all the Buzz Controller buttons.
;
; HOW TO APPLY:
;   Option A — Bind manually (recommended):
;     1. Start the Buzzd server so the virtual controller is active
;     2. PCSX2 → Settings → Controllers → USB tab
;     3. Set USB Port 1 type to "BuzzController"
;     4. Click Configure, then bind each input by clicking it and pressing
;        the matching button on your phone (see order below)
;
;   Option B — Merge into PCSX2.ini directly:
;     File location: ~/.config/PCSX2/inis/PCSX2.ini
;     Copy the [USB1] and [USB1/BuzzController] sections below into that file.
;     The device paths use evdev — your index number (0) may differ if you
;     have other input devices. Check with: ls /dev/input/by-name/
;
; BINDING ORDER — press these buttons on your phone for each input:
;
;   PCSX2 label        Phone button
;   ─────────────────────────────────
;   Player1 / Red    → P1 big red BUZZ button
;   Player1 / Blue   → P1 Blue
;   Player1 / Orange → P1 Orange
;   Player1 / Green  → P1 Green
;   Player1 / Yellow → P1 Yellow
;   Player2 / Red    → P2 big red BUZZ button
;   Player2 / Blue   → P2 Blue
;   ... (same pattern for P3 and P4)

[USB1]
Type = BuzzController

[USB1/BuzzController]
Player1/Red    = evdev/0/Buzz Controller/Button0
Player1/Blue   = evdev/0/Buzz Controller/Button1
Player1/Orange = evdev/0/Buzz Controller/Button2
Player1/Green  = evdev/0/Buzz Controller/Button3
Player1/Yellow = evdev/0/Buzz Controller/Button4
Player2/Red    = evdev/0/Buzz Controller/Button5
Player2/Blue   = evdev/0/Buzz Controller/Button6
Player2/Orange = evdev/0/Buzz Controller/Button7
Player2/Green  = evdev/0/Buzz Controller/Button8
Player2/Yellow = evdev/0/Buzz Controller/Button9
Player3/Red    = evdev/0/Buzz Controller/Button10
Player3/Blue   = evdev/0/Buzz Controller/Button11
Player3/Orange = evdev/0/Buzz Controller/Button12
Player3/Green  = evdev/0/Buzz Controller/Button13
Player3/Yellow = evdev/0/Buzz Controller/Button14
Player4/Red    = evdev/0/Buzz Controller/Button15
Player4/Blue   = evdev/0/Buzz Controller/Button16
Player4/Orange = evdev/0/Buzz Controller/Button17
Player4/Green  = evdev/0/Buzz Controller/Button18
Player4/Yellow = evdev/0/Buzz Controller/Button19
