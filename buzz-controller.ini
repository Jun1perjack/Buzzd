; Buzzd Virtual Controller — PCSX2 USB Configuration
;
; PCSX2 uses SDL for input. The SDL joystick index (SDL-N) depends on how
; many other joysticks/gamepads are connected. Run the auto-patch script to
; detect the correct index automatically:
;
;   python3 ~/Buzzd/server/setup-pcsx2.py
;
; Or find your index manually:
;   cat /proc/bus/input/devices | grep -A5 "Buzz Controller"
;   Look for "Handlers=... jsN ..." — that N is your SDL index.
;
; Then replace SDL-0 below with SDL-<your index> and merge the [USB1]
; section into ~/.config/PCSX2/inis/PCSX2.ini

[USB1]
Type = BuzzDevice
BuzzDevice_Red1    = SDL-0/JoyButton0
BuzzDevice_Blue1   = SDL-0/JoyButton1
BuzzDevice_Orange1 = SDL-0/JoyButton2
BuzzDevice_Green1  = SDL-0/JoyButton3
BuzzDevice_Yellow1 = SDL-0/JoyButton4
BuzzDevice_Red2    = SDL-0/JoyButton5
BuzzDevice_Blue2   = SDL-0/JoyButton6
BuzzDevice_Orange2 = SDL-0/JoyButton7
BuzzDevice_Green2  = SDL-0/JoyButton8
BuzzDevice_Yellow2 = SDL-0/JoyButton9
BuzzDevice_Red3    = SDL-0/JoyButton10
BuzzDevice_Blue3   = SDL-0/JoyButton11
BuzzDevice_Orange3 = SDL-0/JoyButton12
BuzzDevice_Green3  = SDL-0/JoyButton13
BuzzDevice_Yellow3 = SDL-0/JoyButton14
BuzzDevice_Red4    = SDL-0/JoyButton15
BuzzDevice_Blue4   = SDL-0/JoyButton16
BuzzDevice_Orange4 = SDL-0/JoyButton17
BuzzDevice_Green4  = SDL-0/JoyButton18
BuzzDevice_Yellow4 = SDL-0/JoyButton19
