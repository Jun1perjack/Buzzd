; Buzzd Virtual Controller — PCSX2 USB Configuration
;
; PCSX2 uses SDL for input. The SDL joystick index (SDL-N) depends on how
; many other joysticks/gamepads are connected. Run the auto-patch script to
; detect the correct index automatically:
;
;   python3 ~/Buzzd/server/setup-pcsx2.py
;
; Or find your index manually:
;   cat /proc/bus/input/devices | grep -A5 "Buzz Controller"
;   Look for "Handlers=... jsN ..." — that N is your SDL index.
;
; Then replace SDL-0 below with SDL-<your index> and merge the [USB1] and
; [USB1/BuzzController] sections into ~/.config/PCSX2/inis/PCSX2.ini
;
; BUTTON ORDER (what to press in the Buzzd app when binding each input):
;
;   PCSX2 label        Phone button
;   ─────────────────────────────────
;   Player1 / Red    → P1 big red BUZZ button
;   Player1 / Blue   → P1 Blue
;   Player1 / Orange → P1 Orange
;   Player1 / Green  → P1 Green
;   Player1 / Yellow → P1 Yellow
;   Player2 / Red    → P2 big red BUZZ button
;   ... (same pattern for P3 and P4)

[USB1]
Type = BuzzController

[USB1/BuzzController]
Player1/Red    = SDL-0/Button0
Player1/Blue   = SDL-0/Button1
Player1/Orange = SDL-0/Button2
Player1/Green  = SDL-0/Button3
Player1/Yellow = SDL-0/Button4
Player2/Red    = SDL-0/Button5
Player2/Blue   = SDL-0/Button6
Player2/Orange = SDL-0/Button7
Player2/Green  = SDL-0/Button8
Player2/Yellow = SDL-0/Button9
Player3/Red    = SDL-0/Button10
Player3/Blue   = SDL-0/Button11
Player3/Orange = SDL-0/Button12
Player3/Green  = SDL-0/Button13
Player3/Yellow = SDL-0/Button14
Player4/Red    = SDL-0/Button15
Player4/Blue   = SDL-0/Button16
Player4/Orange = SDL-0/Button17
Player4/Green  = SDL-0/Button18
Player4/Yellow = SDL-0/Button19
