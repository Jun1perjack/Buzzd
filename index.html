<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a1a">
  <title>Buzzd — Join</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Join Screen -->
<div id="join-screen" class="screen">
  <div class="join-card">
    <h1>BUZZD</h1>

    <div>
      <label for="input-code">Room Code</label>
      <input
        id="input-code"
        type="text"
        placeholder="e.g. ABCD12"
        maxlength="6"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="characters"
        spellcheck="false"
      >
    </div>

    <div>
      <label for="input-name">Your Name</label>
      <input
        id="input-name"
        type="text"
        placeholder="Enter your name"
        maxlength="20"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      >
    </div>

    <button id="btn-join" class="btn-join">Join Game</button>

    <p id="status-msg" class="status-msg"></p>
  </div>
</div>

<!-- Controller Screen -->
<div id="controller-screen" class="hidden">

  <p id="player-info" class="player-info"></p>

  <div class="buzz-wrap">
    <button class="btn-buzz" data-button="buzz">BUZZ!</button>
  </div>

  <div class="answer-grid">
    <button class="btn-answer" data-button="blue">Blue</button>
    <button class="btn-answer" data-button="orange">Orange</button>
    <button class="btn-answer" data-button="green">Green</button>
    <button class="btn-answer" data-button="yellow">Yellow</button>
  </div>

</div>

<!-- Reconnect Overlay -->
<div id="reconnect-overlay" class="hidden">
  <strong>Connection lost</strong>
  <span id="reconnect-msg">Reconnecting…</span>
</div>

<script src="player.js"></script>
</body>
</html>
