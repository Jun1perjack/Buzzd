<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D0D1A">
  <title>Buzzd — Host</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="host-page">

  <h1 class="host-title">BUZZD</h1>

  <!-- Setup section: shown before server connection -->
  <div id="setup-section" class="card host-setup">
    <h2>Connect to Server</h2>
    <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">
      Start <code>npm start</code> in <code>server/</code>, then paste the ngrok URL below.
    </p>
    <div class="ngrok-form">
      <input id="ngrok-input" type="url" placeholder="https://abc123.ngrok-free.app"
             autocomplete="off" spellcheck="false">
      <button id="btn-connect-server" class="btn-connect">Connect</button>
    </div>
    <p id="server-status" class="status-msg" style="margin-top:10px;"></p>
  </div>

  <!-- Dashboard: shown after connection -->
  <div id="dash-section" class="host-dash hidden">

    <!-- Left column: QR code -->
    <div class="dash-left card" id="qr-container">
      <h2>Scan to Join</h2>
      <div id="qr-canvas"></div>
      <p id="join-url-text" class="join-url-box"></p>
      <div class="dash-left-actions">
        <button id="btn-copy" class="btn-copy">Copy Link</button>
        <button id="btn-reset" class="btn-copy">Change URL</button>
      </div>
    </div>

    <!-- Right column: room code, players, start -->
    <div class="dash-right">

      <div class="card host-room-row">
        <span class="host-room-label">Room</span>
        <span id="room-code" class="room-code">——</span>
      </div>

      <div class="card">
        <h2>Players</h2>
        <div class="player-slots">
          <div class="player-slot">
            <span class="slot-num">1</span>
            <span class="slot-name slot-empty">Empty</span>
            <span class="slot-dot"></span>
          </div>
          <div class="player-slot">
            <span class="slot-num">2</span>
            <span class="slot-name slot-empty">Empty</span>
            <span class="slot-dot"></span>
          </div>
          <div class="player-slot">
            <span class="slot-num">3</span>
            <span class="slot-name slot-empty">Empty</span>
            <span class="slot-dot"></span>
          </div>
          <div class="player-slot">
            <span class="slot-num">4</span>
            <span class="slot-name slot-empty">Empty</span>
            <span class="slot-dot"></span>
          </div>
        </div>
      </div>

      <div class="card" id="start-card">
        <button id="btn-start-game" class="btn-start-game">Start Game</button>
        <p id="start-status" class="status-msg" style="margin-top:8px;"></p>
      </div>

    </div>
  </div>

</div>

<script src="host.js"></script>
</body>
</html>
